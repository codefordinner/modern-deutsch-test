server {
    listen 80;
    server_name localhost;

    # Bulk word import posts a whole list in one request.
    client_max_body_size 6m;

    location /api/ {
        proxy_pass http://app-backend:3001;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        # Host including the port: the backend compares it with the Origin header (CSRF check).
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # The service worker and the manifest must always be revalidated, or updates never reach installed apps.
    location = /sw.js {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-cache";
    }

    location = /manifest.webmanifest {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-cache";
        default_type application/manifest+json;
    }

    # Hashed build output never changes under the same name.
    location /assets/ {
        root /usr/share/nginx/html;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }
}
