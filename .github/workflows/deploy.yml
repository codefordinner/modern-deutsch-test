name: CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check application
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install workspace dependencies
        run: npm ci

      - name: Check backend
        run: |
          npm --prefix backend run lint
          npm --prefix backend run build

      - name: Test backend
        run: npm --prefix backend test

      - name: Check frontend
        run: |
          npm --prefix frontend run typecheck
          npm --prefix frontend run lint
          npm --prefix frontend run test
          npm --prefix frontend run build

      - name: Check Telegram bot
        run: |
          npm --workspace @sprachfunke/telegram-bot run build
          npm --workspace @sprachfunke/telegram-bot test

  docker:
    name: Build and push Docker images
    runs-on: ubuntu-latest
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Lowercase repository owner
        id: owner
        run: |
          echo "owner=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./backend/Dockerfile
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ghcr.io/${{ steps.owner.outputs.owner }}/my-trainer-app-backend:latest
            ghcr.io/${{ steps.owner.outputs.owner }}/my-trainer-app-backend:${{ github.sha }}

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./frontend/Dockerfile
          push: true
          build-args: |
            BUILD_VERSION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ghcr.io/${{ steps.owner.outputs.owner }}/my-trainer-app-frontend:latest
            ghcr.io/${{ steps.owner.outputs.owner }}/my-trainer-app-frontend:${{ github.sha }}

      - name: Build and push Telegram bot
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./packages/telegram-bot/Dockerfile
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ghcr.io/${{ steps.owner.outputs.owner }}/my-trainer-app-telegram-bot:latest
            ghcr.io/${{ steps.owner.outputs.owner }}/my-trainer-app-telegram-bot:${{ github.sha }}
